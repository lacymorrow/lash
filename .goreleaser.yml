# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
# vim: set ts=2 sw=2 tw=0 fo=jcroql
version: 2

project_name: lash

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

snapshot:
  version_template: "0.0.0-{{ .Timestamp }}"

before:
  hooks:
    - go mod tidy
    - rm -rf completions
    - mkdir completions
    - rm -rf manpages
    - mkdir manpages
    - sh -c 'go run . completion bash >./completions/lash.bash'
    - sh -c 'go run . completion zsh >./completions/lash.zsh'
    - sh -c 'go run . completion fish >./completions/lash.fish'
    - sh -c 'go run . man | gzip -c >./manpages/lash.1.gz'

# gomod:
#   proxy: true

builds:
  - env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=greenteagc
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
      - netbsd
      - android
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "7"
    ignore:
      - goos: android
        goarch: amd64
      - goos: android
        goarch: arm
      - goos: android
        goarch: "386"
    ldflags:
      - -s -w -X github.com/lacymorrow/lash/internal/version.Version={{.Version}}

archives:
  - name_template: >-
      lash_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- with .Arm}}v{{ . }}{{ end }}
    wrap_in_directory: true
    files:
      - README*
      - LICENSE*
      - manpages/*
      - completions/*
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"





nfpms:
  - formats:
      - apk
      - deb
      - rpm
      - archlinux
      - termux.deb
    file_name_template: "{{ .ConventionalFileName }}"
    maintainer: "Lacy Morrow <me@lacymorrow.com>"
    contents:
      - src: ./completions/lash.bash
        dst: /etc/bash_completion.d/lash
      - src: ./completions/lash.fish
        dst: /usr/share/fish/vendor_completions.d/lash.fish
      - src: ./completions/lash.zsh
        dst: /usr/share/zsh/site-functions/_lash
      - src: ./manpages/lash.1.gz
        dst: /usr/share/man/man1/lash.1.gz
    rpm:
      signature:
        key_file: '{{ if ne (index .Env "GPG_KEY_PATH") "" }}{{ .Env.GPG_KEY_PATH }}{{ else }}{{ end }}'
    deb:
      signature:
        key_file: '{{ if ne (index .Env "GPG_KEY_PATH") "" }}{{ .Env.GPG_KEY_PATH }}{{ else }}{{ end }}'

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

source:
  enabled: true

sboms:
  - artifacts: archive
  - id: source
    artifacts: source

brews:
  - name: lash
    repository:
      owner: lacymorrow
      name: homebrew-tap
    homepage: "https://github.com/lacymorrow/lash"
    description: "Terminal-based AI assistant for software developers"
    license: "MIT"
    install: |
      bin.install "lash"
      bash_completion.install "completions/lash.bash" => "lash"
      zsh_completion.install "completions/lash.zsh" => "_lash"
      fish_completion.install "completions/lash.fish"
      man1.install "manpages/lash.1.gz"

publishers:
  - name: npm
    cmd: npm publish --access public
    env:
      - NPM_TOKEN={{ .Env.NPM_TOKEN }}
    dir: "{{ .Dir }}"



changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^(build|ci): "
      - "^chore: auto-update generated files$"
      - "^chore: docs$"
      - "^chore: schema update$"
      - "^chore: schema$"
      - "^chore: typo$"
      - "^chore: update schema$"
      - "^chore: update$"
      - "^chore\\(legal\\): "
      - "^chore\\(deps\\): "
      - "^docs: update$"
      - "^test:"
      - "^test\\("
      - "merge conflict"
      - "merge conflict"
      - Merge branch
      - Merge pull request
      - Merge remote-tracking branch
      - go mod tidy
      - "^wip "
      - "^wip:"
  groups:
    - title: "New Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 100
    - title: "Security updates"
      regexp: '^.*?sec(\(.+\))??!?:.+$'
      order: 150
    - title: "Bug fixes and improvements"
      regexp: '^.*?(fix|refactor)(\(.+\))??!?:.+$'
      order: 200
    - title: "Documentation updates"
      regexp: ^.*?docs?(\(.+\))??!?:.+$
      order: 400
    - title: Other work
      order: 9999

release:
  prerelease: auto
